name: publish
concurrency: publish
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    name: Publish container image
    runs-on: ubuntu-latest
    permissions:
      id-token: none
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v3
      - shell: bash
        run: |
          mkdir -p ./build
      - id: manifest
        run: |
          set -euo pipefail

          wget -qO ./build/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x ./build/yq

          RAW_VERSION="${GITHUB_REF_NAME#v}"
          EPOCH="0"
          if [[ "$RAW_VERSION" =~ ^(.+)-r([0-9]+)$ ]]; then
            RAW_VERSION="${BASH_REMATCH[1]}"
            EPOCH="${BASH_REMATCH[2]}"
          fi

          VERSION="$RAW_VERSION"
          VERSION_1="$(echo "$VERSION" | cut -d. -f1)"
          VERSION_2="$VERSION_1.$(echo "$VERSION" | cut -d. -f2)"
          VERSION_3="$VERSION_1.$VERSION_2.$(echo "$VERSION" | cut -d. -f3)"

          VERSION="$VERSION" EPOCH="$EPOCH" ./build/yq eval -i '.package.version = strenv(VERSION) | .package.epoch = (strenv(EPOCH) | tonumber)' ./container-image/melange.yaml

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_1=$VERSION_1" >> $GITHUB_OUTPUT
          echo "version_2=$VERSION_2" >> $GITHUB_OUTPUT
          echo "version_3=$VERSION_3" >> $GITHUB_OUTPUT
          echo "version_full=${VERSION}-r${EPOCH}" >> $GITHUB_OUTPUT
      - uses: chainguard-dev/actions/melange-build@v1.4.3
        id: melange
        with:
          archs: x86_64
          config: ./container-image/melange.yaml
          sign-with-temporary-key: true
          signing-key-path: ./build/melange.rsa
          repository-path: ./build/packages
          source-dir: ${{ github.workspace }}
      - uses: chainguard-images/actions/apko-publish@v1.0.0
        id: apko
        with:
          archs: amd64
          config: ./container-image/apko.yaml
          tag: "ghcr.io/${{ github.repository }}:${{ steps.manifest.outputs.version_full }} ghcr.io/${{ github.repository }}:${{ steps.manifest.outputs.version }} ghcr.io/${{ github.repository }}:${{ steps.manifest.outputs.version_3 }} ghcr.io/${{ github.repository }}:${{ steps.manifest.outputs.version_2 }} ghcr.io/${{ github.repository }}:${{ steps.manifest.outputs.version_1 }} ghcr.io/${{ github.repository }}:latest"
          keyring-append: ./build/melange.rsa.pub