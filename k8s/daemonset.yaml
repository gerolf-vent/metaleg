---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metaleg-agent
  namespace: metallb-system
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    spec:
      serviceAccountName: metaleg-agent
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoExecute
        operator: Exists
      hostNetwork: true
      hostPID: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: metaleg-agent
        image: ghcr.io/gerolf-vent/metaleg-agent
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
            - NET_RAW
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        ports:
        - containerPort: 21793
          name: metrics
          protocol: TCP
        - containerPort: 21794
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 21794
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 21794
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: METALLB_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        envFrom:
        - configMapRef:
            name: metaleg-agent-config
            optional: true
        volumeMounts:
        - name: xtables-lock
          mountPath: /run/xtables.lock
      terminationGracePeriodSeconds: 30
      priorityClassName: system-node-critical
      volumes:
      - name: xtables-lock
        hostPath:
          path: /run/xtables.lock
          type: File
